<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Now Playing Overlay — Test Harness (DEV ONLY)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Test-harness-only styling; not part of the on-stream overlay. */
    body { background: #2b2b2b; }
    #mock-controls {
      position: fixed;
      top: 0;
      left: 0;
      background: rgba(0, 0, 0, 0.85);
      color: #eee;
      padding: 12px;
      font: 13px/1.4 sans-serif;
      z-index: 1000;
    }
    #mock-controls h3 { margin: 0 0 8px; font-size: 13px; }
    #mock-controls .row { margin-bottom: 8px; }
    #mock-controls button {
      margin-right: 6px;
      margin-bottom: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- DEV/TEST ONLY: simulation controls for the mock OBS/YouTube harness.
       Not present in overlay/index.html and never shown in a real OBS
       Browser Source. -->
  <div id="mock-controls">
    <h3>Mock Controls (test.html only)</h3>
    <div class="row">
      Video:
      <button type="button" data-video="dQw4w9WgXcQ">A</button>
      <button type="button" data-video="jNQXAC9IVRw">B</button>
      <button type="button" data-video="M7lc1UVf_VE">C</button>
    </div>
    <div class="row">
      Source: <button id="btn-show" type="button">Show</button>
      <button id="btn-hide" type="button">Hide</button>
    </div>
    <div class="row">
      Scene:
      <button data-scene="Scene 1" type="button">Scene 1 (has source)</button>
      <button data-scene="Scene 2" type="button">Scene 2 (empty)</button>
    </div>
  </div>

  <!-- Main on-stream overlay. Hidden until a YouTube video is detected. -->
  <div id="now-playing" class="hidden">
    <a id="overlay-link" href="#" target="_blank" rel="noopener noreferrer">
      <img id="avatar" alt="" src="">
      <div id="text">
        <div id="channel-name"></div>
        <div id="video-title"></div>
      </div>
    </a>
  </div>

  <!-- Settings gear: click to open the configuration panel. -->
  <button id="settings-toggle" type="button" title="Settings (or press 's')">&#9881;</button>

  <div id="settings-panel" class="hidden">
    <form id="settings-form">
      <h2>Now Playing Overlay Settings</h2>

      <label for="obsUrl">obs-websocket URL</label>
      <input id="obsUrl" name="obsUrl" type="text" placeholder="ws://127.0.0.1:4455">

      <label for="obsPassword">obs-websocket Password</label>
      <input id="obsPassword" name="obsPassword" type="password" placeholder="(optional)">

      <label for="youtubeApiKey">YouTube Data API v3 Key</label>
      <input id="youtubeApiKey" name="youtubeApiKey" type="text" placeholder="AIza...">

      <label for="pollIntervalMs">Poll Interval (ms)</label>
      <input id="pollIntervalMs" name="pollIntervalMs" type="number" min="500" step="500" placeholder="2000">

      <label for="sourceNameFilter">Source Name Filter (optional)</label>
      <input id="sourceNameFilter" name="sourceNameFilter" type="text" placeholder="Leave blank to watch all browser sources">

      <div id="settings-actions">
        <button id="settings-save" type="submit">Save</button>
        <button id="settings-close" type="button">Close</button>
      </div>
    </form>
  </div>

  <script src="js/mock.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/obs.js"></script>
  <script src="js/youtube.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.querySelectorAll("[data-video]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        window.NowPlayingMock.setVideo(btn.getAttribute("data-video"));
      });
    });
    document.getElementById("btn-show").addEventListener("click", function () {
      window.NowPlayingMock.setSourceVisible(true);
    });
    document.getElementById("btn-hide").addEventListener("click", function () {
      window.NowPlayingMock.setSourceVisible(false);
    });
    document.querySelectorAll("[data-scene]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        window.NowPlayingMock.switchScene(btn.getAttribute("data-scene"));
      });
    });
  </script>
</body>
</html>
